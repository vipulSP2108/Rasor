<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Auto-VAD Mic</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 10px 15px;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: transparent;
            color: white;
            height: 100vh;
            box-sizing: border-box;
        }
        .info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .title {
            font-weight: bold;
            font-size: 14px;
        }
        button {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            transition: all 0.2s;
        }
        #start-btn {
            background-color: #ff4b4b;
            color: white;
        }
        #start-btn:hover {
            background-color: #ff3333;
        }
        #stop-btn {
            background-color: rgba(255,255,255,0.1);
            color: white;
            display: none;
        }
        #status {
            font-size: 12px;
            color: #aaa;
            font-weight: 500;
        }
        .pulsing {
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="info">
        <span class="title">🎤 Voice Mode</span>
        <span id="status">Idle</span>
    </div>
    <button id="start-btn">Start</button>
    <button id="stop-btn">Stop</button>

    <script>
        // --- Streamlit Component API ---
        function sendMessageToStreamlitClient(type, data) {
            const outData = Object.assign({
                isStreamlitMessage: true,
                type: type,
            }, data);
            window.parent.postMessage(outData, "*");
        }

        const Streamlit = {
            setComponentReady: function() {
                sendMessageToStreamlitClient("streamlit:componentReady", {apiVersion: 1});
            },
            setFrameHeight: function(height) {
                sendMessageToStreamlitClient("streamlit:setFrameHeight", {height: height});
            },
            setComponentValue: function(value) {
                sendMessageToStreamlitClient("streamlit:setComponentValue", {value: value});
            }
        };

        window.addEventListener("message", function(event) {
            if (event.data.type === "streamlit:render") {
                Streamlit.setFrameHeight(document.body.scrollHeight);
                const args = event.data.args;
                
                // If python tells us to forcefully stop
                if (args && args.force_stop === true) {
                    if (isListening) {
                        stopSession(false);
                        statusEl.innerText = "Automatically stopped (Results ready)";
                        statusEl.style.color = "#4CAF50"; // green
                    }
                    return;
                }
                
                // If python tells us to wait (Stylist is speaking)
                if (args && args.wait_ms > 0 && isListening) {
                    statusEl.innerText = "Stylist is speaking...";
                    statusEl.className = "";
                    statusEl.style.color = "#aaa";
                    
                    if (window.resumeTimer) clearTimeout(window.resumeTimer);
                    
                    window.resumeTimer = setTimeout(() => {
                        window.resumeTimer = null;
                        if (isListening) {
                            statusEl.innerText = "Listening... (Speak now)";
                            statusEl.className = "pulsing";
                            startRecordingChunk(window.currentStream);
                        }
                    }, args.wait_ms);
                }
            }
        });

        Streamlit.setComponentReady();
        Streamlit.setFrameHeight(60);

        // --- VAD & Audio Recording Logic ---
        let mediaRecorder;
        let audioChunks = [];
        let audioContext;
        let analyser;
        let microphone;
        let silenceTimer;
        let initialSilenceTimer;
        let isRecording = false;
        let isListening = false;
        let hasSpoken = false;
        
        const SILENCE_THRESHOLD = 15; // volume threshold (0-255)
        const SILENCE_DURATION_MS = 3000; // 3 seconds of pause

        const startBtn = document.getElementById("start-btn");
        const stopBtn = document.getElementById("stop-btn");
        const statusEl = document.getElementById("status");

        async function startSession() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                window.currentStream = stream; // save for later
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 512;
                analyser.smoothingTimeConstant = 0.8;
                
                microphone = audioContext.createMediaStreamSource(stream);
                microphone.connect(analyser);
                
                startBtn.style.display = "none";
                stopBtn.style.display = "block";
                isListening = true;
                
                startRecordingChunk(stream);
                monitorSilence();
                
                statusEl.innerText = "Listening... (Speak now)";
                statusEl.className = "pulsing";
                Streamlit.setComponentValue({ status: "listening", audio: null });

            } catch (err) {
                statusEl.innerText = "Error: " + err.message;
                statusEl.style.color = "red";
            }
        }

        function stopSession(triggerRerun = true) {
            isListening = false;
            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
            }
            if (audioContext) {
                audioContext.close();
            }
            clearTimeout(silenceTimer);
            startBtn.style.display = "block";
            stopBtn.style.display = "none";
            if (triggerRerun) {
                statusEl.innerText = "Idle";
                statusEl.className = "";
                Streamlit.setComponentValue({ status: "idle", audio: null });
            }
        }

        function startRecordingChunk(stream) {
            audioChunks = [];
            hasSpoken = false;
            
            // Set 10-second initial timeout
            if (initialSilenceTimer) clearTimeout(initialSilenceTimer);
            initialSilenceTimer = setTimeout(() => {
                if (!hasSpoken && isListening) {
                    stopSession();
                    statusEl.innerText = "Timed out (No voice detected)";
                    statusEl.style.color = "#FF9800"; // orange warning
                }
            }, 10000);
            
            mediaRecorder = new MediaRecorder(stream);
            mediaRecorder.ondataavailable = e => {
                if (e.data.size > 0) audioChunks.push(e.data);
            };
            mediaRecorder.onstop = async () => {
                isRecording = false;
                if (audioChunks.length > 0 && isListening) {
                    const blob = new Blob(audioChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.readAsDataURL(blob);
                    reader.onloadend = function() {
                        const base64data = reader.result.split(',')[1];
                        statusEl.innerText = "Thinking...";
                        statusEl.className = "";
                        // Send audio to Python. We wait for Python to send tts_audio_b64 back to resume!
                        Streamlit.setComponentValue({ status: "processing", audio: base64data });
                    };
                }
            };
            mediaRecorder.start();
            isRecording = true;
        }

        function monitorSilence() {
            if (!isListening) return;
            
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);
            
            let sum = 0;
            for(let i = 0; i < bufferLength; i++) {
                sum += dataArray[i];
            }
            const average = sum / bufferLength;

            if (average > SILENCE_THRESHOLD) {
                // User is speaking, reset silence timers
                hasSpoken = true;
                if (initialSilenceTimer) {
                    clearTimeout(initialSilenceTimer);
                    initialSilenceTimer = null;
                }
                clearTimeout(silenceTimer);
                silenceTimer = null;
            } else {
                // Silence detected
                if (hasSpoken && !silenceTimer && isRecording) {
                    silenceTimer = setTimeout(() => {
                        silenceTimer = null;
                        // User paused for 3 seconds! Stop recording and send chunk.
                        if (mediaRecorder.state === "recording") {
                            mediaRecorder.stop(); // This triggers onstop, sends data, and restarts
                        }
                    }, SILENCE_DURATION_MS);
                }
            }
            
            requestAnimationFrame(monitorSilence);
        }

        startBtn.onclick = startSession;
        stopBtn.onclick = stopSession;
    </script>
</body>
</html>
